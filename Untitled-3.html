<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Curtain Scroll Demo</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
}

/* SCROLL SPACE */
#curtain-wrapper {
  height: 400vh; /* 4 section */
  position: relative;
}

/* STAGE */
#stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

/* SCENES */
.scene {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  color: white;
}

/* warna biar jelas */
.s1 { background: #6a5acd; z-index: 1; }
.s2 { background: #ff6347; z-index: 2; clip-path: inset(100% 0 0 0); }
.s3 { background: #2e8b57; z-index: 3; clip-path: inset(100% 0 0 0); }
.s4 { background: #111;    z-index: 4; clip-path: inset(100% 0 0 0); }

/* NORMAL SECTION */
#section5 {
  min-height: 100vh;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>
<!-- NORMAL SCROLL -->
<section id="section5">
  <h1>SECTION OPENING (NORMAL SCROLL)</h1>
</section>

<!-- CURTAIN AREA -->
<div id="curtain-wrapper">
  <div id="stage">

    <section class="scene s1">SECTION 1</section>
    <section class="scene s2">SECTION 2</section>
    <section class="scene s3">SECTION 3</section>
    <section class="scene s4">SECTION 4</section>

  </div>
</div>

<!-- NORMAL SCROLL -->
<section id="section5">
  <h1>SECTION 5 (NORMAL SCROLL)</h1>
</section>

<script>
const wrapper = document.getElementById("curtain-wrapper");
const stage   = document.getElementById("stage");
const scenes  = document.querySelectorAll(".scene");

const TOTAL = scenes.length;

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function ease(t) {
  return t * t * (3 - 2 * t); // smoothstep
}

window.addEventListener("scroll", () => {
  const start = wrapper.offsetTop;
  const end   = start + wrapper.offsetHeight - window.innerHeight;
  const y     = window.scrollY;

  /* =========================
     SEBELUM CURTAIN
  ========================= */
  if (y < start) {
    stage.style.position = "absolute";
    stage.style.top = "0";
    return;
  }

  /* =========================
     SETELAH CURTAIN
  ========================= */
  if (y >= end) {
    stage.style.position = "absolute";
    stage.style.top = `${wrapper.offsetHeight - window.innerHeight}px`;

    scenes.forEach((scene, i) => {
      if (i > 0) scene.style.clipPath = "inset(0 0 0 0)";
    });

    return;
  }

  /* =========================
     CURTAIN ACTIVE
  ========================= */
  stage.style.position = "fixed";
  stage.style.top = "0";

  const progress =
    ((y - start) / (end - start)) * TOTAL;

  scenes.forEach((scene, i) => {
    if (i === 0) return;

    const local = clamp(progress - i, 0, 1);
    const reveal = 100 - ease(local) * 100;
    scene.style.clipPath = `inset(${reveal}% 0 0 0)`;
  });
});
</script>
</body>
</html>
